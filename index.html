<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blank HTML5 Template</title>
    <!-- Link to your external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main structural elements can go here (e.g., <header>, <main>, <footer>) -->
    <h1>Hello, world!</h1>
    <div id="slides">
    </div>

    <div>
  <h2>Students</h2>
  <div id="students">Loading...</div>
</div>

<div>
  <h2>Attendance</h2>
  <div id="attendance">Loading...</div>
</div>

<div>
  <h2>Enquiries</h2>
  <div id="enquiries">Loading...</div>
</div>

<div>
  <h2>Admissions</h2>
  <div id="admissions">Loading...</div>
</div>
    <!-- Link to your external JavaScript file -->
    <script>
      const url =
  "https://docs.google.com/spreadsheets/d/1OsQsd-vw6LLWmG5B-GBB8Xxj8nyw3D4MHubBph2Z0CA/gviz/tq?tqx=out:json&sheet=home";

fetch(url)
  .then(response => response.text())
  .then(text => {
    const json = JSON.parse(
      text.substring(47).slice(0, -2)
    );

    console.log(json.table.rows);
      alert(json.table.rows);
  });
const API_URL =
  "https://script.google.com/macros/s/AKfycbyWfV1KcPW_6f3COBHUnXexpw-c_70IdIooBLk7Tkl3ZP12UYrIWjmQPgVTrw1BnSS5rQ/exec";

async function loadDashboard() {
  try {
    const response = await fetch(API_URL);

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();

    console.log(data);

    document.querySelector("#students").textContent = data.students;
    document.querySelector("#attendance").textContent =
      `${data.attendance}%`;
    document.querySelector("#enquiries").textContent = data.enquiries;
    document.querySelector("#admissions").textContent = data.admissions;

  } catch (error) {
    console.error("Dashboard API error:", error);
  }
}

loadDashboard();
    </script>
</body>
</html>
